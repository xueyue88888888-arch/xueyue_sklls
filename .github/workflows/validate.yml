name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill folders
        run: python .github/scripts/validate_skills.py .

      - name: Figma plugin JS syntax
        run: |
          files=$(find . -path '*/plugin/*.js' -not -path './.git/*')
          if [ -z "$files" ]; then echo "no plugin js"; exit 0; fi
          command -v node >/dev/null || { echo "node missing"; exit 1; }
          for f in $files; do echo "checking $f"; node --check "$f"; done

      - name: Python scripts compile
        run: |
          files=$(find . -name '*.py' -not -path './.git/*')
          echo "$files"
          python -m py_compile $files

      - name: No files over 1MB
        run: |
          big=$(find . -type f -size +1M -not -path './.git/*')
          if [ -n "$big" ]; then
            echo "$big"
            echo "::error::files over 1MB — keep binaries out of the repo"
            exit 1
          fi
